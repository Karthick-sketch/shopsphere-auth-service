spring.application.name=shopsphere-auth-service

server.port=8087

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/shopsphere_auth_service
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Token Configuration
token.key-ID=${KEY_ID:auth-service-key-1}
token.private-key-path=${PRIVATE_KEY_PATH}
token.public-key-path=${PUBLIC_KEY_PATH}
# units in minutes
token.access-expiration=${ACCESS_EXPIRATION:15}
token.refresh-expiration=${REFRESH_EXPIRATION:10080}

# Service Client Credentials (clientId=secret)
service.clients.cart-service=${CART_SERVICE_SECRET}
service.clients.order-service=${ORDER_SERVICE_SECRET}

## Kafka Properties
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic.user-created=${KAFKA_USER_CREATED_TOPIC:user-created-events}
