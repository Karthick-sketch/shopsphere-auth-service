spring.application.name=shopsphere-auth-service

server.port=8087

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/shopsphere_auth_service
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Token Configuration
token.access-secret=${ACCESS_SECRET}
token.access-expiration=${ACCESS_EXPIRATION:900000}
token.refresh-expiration=${REFRESH_EXPIRATION:604800000}
token.cookie-name=${COOKIE_NAME:refresh-token}
